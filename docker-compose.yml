version: '3.8'

# Rotate container logs so they can't fill the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=${MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE}
      # First-install settings (used only when WordPress is not installed yet)
      - WORDPRESS_URL=${WP_SITEURL:-}
      - WORDPRESS_TITLE=${WP_TITLE:-}
      - WORDPRESS_ADMIN_USER=${WP_ADMIN_USER:-}
      - WORDPRESS_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-}
      - WORDPRESS_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-}
      - INSTALL_REDIS_PLUGIN=${INSTALL_REDIS_PLUGIN:-false}
      - DEFAULT_THEME=${DEFAULT_THEME:-}
      - PHP_FPM_MAX_CHILDREN=${PHP_FPM_MAX_CHILDREN:-20}
    volumes:
      - wordpress:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./config/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./config/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./config/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    healthcheck:
      # PHP-FPM is ready once it accepts connections on port 9000
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 300s
    # Cap memory so a runaway PHP worker can't take down the host; tune per server
    mem_limit: ${WORDPRESS_MEM_LIMIT:-2g}
    logging: *default-logging
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - wordpress:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./config/nginx:/etc/nginx/conf.d
    logging: *default-logging
    depends_on:
      wordpress:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    logging: *default-logging

volumes:
  wordpress:
  mysql:
  redis:
