version: '3.8'

services:
  wordpress:
    environment:
      - WORDPRESS_DEBUG=1

  # DB and cache are bound to localhost only, so they aren't reachable from the LAN
  mysql:
    ports:
      - "127.0.0.1:33060:3306"

  nginx:
    ports:
      - "8080:80"

  redis:
    ports:
      - "127.0.0.1:63790:6379"
